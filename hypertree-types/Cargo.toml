[package]
name = "hypertree-types"
version = "0.4.0"
edition = "2021"
description = "Corona leaf 14 — an XMSS^MT-style hypertree signature as a COMPOSITION of mss-types with ITSELF (mss ∘ mss). TOY: a type-discipline demonstration, not production crypto — at the inherited 64-bit Lamport width it is existentially forgeable under chosen message at ~2^32, the demo seeds are 24-bit, and there is no verifier-side doorway to the public key."
license = "MIT"

# The garden's first RECURSIVE composition: it COMPOSES a single sibling leaf (a second, merkle-types, is imported only to name its digest type in public signatures) —
# `mss-types` (itself merkle ∘ lamport) — and nests it under itself. A top keychain
# signs the root of a bottom keychain; the bottom signs the message. Built strictly
# on mss-types' public surface, with NO new rungs into it (∥ leaf 8's verbatim reuse
# of `adopt_scoped`). See the "what recursive composition discovered" section in lib.rs.
[dependencies]
mss-types = { path = "../mss-types" }
# For the digest type of the (graduated) Merkle root that mss re-exposes via
# `root_hash()` — SHA-256's `[u8; 32]`, named through merkle's `hash::Digest`.
merkle-types = { path = "../merkle-types" }
