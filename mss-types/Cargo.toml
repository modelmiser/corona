[package]
name = "mss-types"
version = "0.2.0"
edition = "2021"
description = "Corona leaf 7 — the Merkle Signature Scheme as a COMPOSITION of merkle-types and lamport-types. GRADUATED 2026-09-08 by inheritance (both parents graduated; Sol.Lib.Mss is its wire; criterion #5 OPEN — round record in TODO.md) — still not production crypto: demo/reused seed, fixed capacity, inherited 64-bit width."
license = "MIT"

# The garden's first COMPOSITION leaf: it deliberately imports two sibling LEAVES
# (not corona-core) and builds strictly on their public surfaces. That is the
# thesis being tested here — that leaves compose into a stronger guarantee through
# their sealed public APIs alone, with no new primitive and no private access.
# See the "What composition discovered" paragraph under "The finding" in lib.rs.
[dependencies]
merkle-types = { path = "../merkle-types" }
lamport-types = { path = "../lamport-types" }
